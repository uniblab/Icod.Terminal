name: pr-build-and-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet clean ${{ github.event.repository.name }}.sln -c Staging
      - run: dotnet restore ${{ github.event.repository.name }}.sln
      - run: dotnet build ${{ github.event.repository.name }}.sln -c Staging --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test ${{ github.event.repository.name }}.sln -c Staging --no-build --logger trx

      - name: Pack Staging package
        run: dotnet pack ${{ github.event.repository.name }}.csproj -c Staging --no-build --output artifacts

      - name: Verify Staging package on Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: .github\scripts\verify-release-package.cmd artifacts Staging

      - name: Verify Staging package on POSIX
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash .github/scripts/verify-release-package.sh artifacts Staging

      - name: Upload validated Staging package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: icod-terminal-pr-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7
