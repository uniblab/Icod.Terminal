name: distribution-validation

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Staging
          - Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: ${{ inputs.configuration }}
  PACKAGE_CANDIDATE_ARTIFACT: icod-terminal-distribution-package-candidate

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
          - os: windows-11-arm
            name: Windows ARM64
          - os: ubuntu-24.04
            name: Linux x64
          - os: ubuntu-24.04-arm
            name: Linux ARM64
          - os: macos-15-intel
            name: macOS x64
          - os: macos-15
            name: macOS ARM64
    name: Runtime ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify runtime and source integration
        shell: pwsh
        run: ./packaging/VerifyRuntime.ps1 -Configuration '${{ env.CONFIGURATION }}'

  package-prep:
    name: Package candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build package candidate and freeze public API
        shell: pwsh
        run: >-
          ./packaging/BuildPackageArtifact.ps1
          -ArtifactDirectory artifacts/package
          -Configuration '${{ env.CONFIGURATION }}'
          -ApiOutputDirectory artifacts/public-api
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_CANDIDATE_ARTIFACT }}
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
            artifacts/public-api/*.txt
          if-no-files-found: error
          retention-days: 7

  package-contracts:
    needs: package-prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: foundation
            name: Foundation
          - shard: presentation
            name: Presentation
          - shard: semantic
            name: Semantic and hardening
          - shard: release
            name: Stable 1.x release line
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_CANDIDATE_ARTIFACT }}
          path: artifacts/candidate
      - name: Verify package contract shard
        shell: pwsh
        run: >-
          ./packaging/VerifyPackageContractShard.ps1
          -ArtifactDirectory artifacts/candidate/package
          -Shard '${{ matrix.shard }}'
          -Configuration '${{ env.CONFIGURATION }}'
