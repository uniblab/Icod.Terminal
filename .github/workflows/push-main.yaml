name: main validation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet clean ${{ github.event.repository.name }}.sln -c Release
      - run: dotnet restore ${{ github.event.repository.name }}.sln
      - run: dotnet build ${{ github.event.repository.name }}.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test ${{ github.event.repository.name }}.sln -c Release --no-build --logger trx

      - name: Pack Release package
        run: dotnet pack ${{ github.event.repository.name }}.csproj -c Release --no-build --output artifacts

      - name: Verify Release package on Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: .github\scripts\verify-release-package.cmd artifacts Release

      - name: Verify Release package on POSIX
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash .github/scripts/verify-release-package.sh artifacts Release

      - name: Upload validated Release package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: icod-terminal-main-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7
