name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  RELEASE_DIRECTORY: artifacts/release
  SELECTED_PACKAGE_DIRECTORY: artifacts/release-packages
  PACKAGE_ARTIFACT: nuget-packages

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      solution_path: ${{ steps.repository.outputs.solution_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - id: repository
        shell: pwsh
        run: ./packaging/Get-RepositoryMetadata.ps1 -Configuration '${{ env.CONFIGURATION }}' -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Require solution
        shell: pwsh
        run: |
          if ('true' -ne '${{ steps.repository.outputs.has_solution }}') {
              throw 'A tagged release requires exactly one root .sln or .slnx file.'
          }
      - name: Require tagged commit on default branch
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if (0 -ne $LASTEXITCODE) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not point to a commit contained in 'main'."
          }
      - id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$tag' is not a supported v<semver> tag."
          }
          $version = $Matches.version
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  package:
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.select.outputs.has_packages }}
      package_count: ${{ steps.select.outputs.package_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore '${{ needs.metadata.outputs.solution_path }}'
      - run: dotnet build '${{ needs.metadata.outputs.solution_path }}' -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test '${{ needs.metadata.outputs.solution_path }}' -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx
      - name: Verify DCurses synchronized-output acceptance
        shell: pwsh
        run: ./packaging/VerifyDCursesSynchronizedOutput.ps1 -Configuration '${{ env.CONFIGURATION }}'
      - run: dotnet pack '${{ needs.metadata.outputs.solution_path }}' -c ${{ env.CONFIGURATION }} --no-build --no-restore -o ${{ env.RELEASE_DIRECTORY }} -p:ContinuousIntegrationBuild=true
      - id: select
        shell: pwsh
        run: ./packaging/SelectReleasePackages.ps1 -SourceDirectory '${{ env.RELEASE_DIRECTORY }}' -DestinationDirectory '${{ env.SELECTED_PACKAGE_DIRECTORY }}' -ExpectedVersion '${{ needs.metadata.outputs.version }}' -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Require Icod.Terminal release package
        shell: pwsh
        run: |
          if ('true' -ne '${{ steps.select.outputs.has_packages }}' -or '1' -ne '${{ steps.select.outputs.package_count }}') {
              throw 'The Icod.Terminal release must select exactly one package matching the release tag.'
          }
      - name: Verify exact release package artifacts
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory '${{ env.SELECTED_PACKAGE_DIRECTORY }}' -Configuration '${{ env.CONFIGURATION }}' -ExpectedVersion '${{ needs.metadata.outputs.version }}'
      - name: Verify 0.8 cursor-style release contract
        shell: pwsh
        run: ./packaging/VerifyCursorStylePackage.ps1 -ArtifactDirectory '${{ env.SELECTED_PACKAGE_DIRECTORY }}' -Configuration '${{ env.CONFIGURATION }}' -ExpectedVersion '${{ needs.metadata.outputs.version }}'
      - name: Verify 0.9 synchronized-output release contract
        shell: pwsh
        run: ./packaging/VerifySynchronizedOutputPackage.ps1 -ArtifactDirectory '${{ env.SELECTED_PACKAGE_DIRECTORY }}' -Configuration '${{ env.CONFIGURATION }}' -ExpectedVersion '${{ needs.metadata.outputs.version }}'
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: |
            ${{ env.SELECTED_PACKAGE_DIRECTORY }}/*.nupkg
            ${{ env.SELECTED_PACKAGE_DIRECTORY }}/*.snupkg
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'artifacts/package' -Filter '*.nupkg' -File)
          if (1 -ne $packages.Count) { throw "Expected one NuGet package; found $($packages.Count)." }
          $package = $packages[0]
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw "NuGet.org publication failed for '$($package.Name)' with status $LASTEXITCODE." }

  publish-github-packages:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          $packages = @(Get-ChildItem -LiteralPath 'artifacts/package' -Filter '*.nupkg' -File)
          if (1 -ne $packages.Count) { throw "Expected one GitHub package; found $($packages.Count)." }
          $package = $packages[0]
          dotnet nuget push $package.FullName --source $source --api-key $env:GITHUB_TOKEN --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw "GitHub Packages publication failed for '$($package.Name)' with status $LASTEXITCODE." }

  github-release:
    needs: [metadata, package, publish-nuget, publish-github-packages]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.package.result == 'success' &&
      needs.publish-nuget.result == 'success' &&
      needs.publish-github-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/release-assets
      - name: Create checksums
        shell: pwsh
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File | Where-Object { $_.Extension -in @('.nupkg', '.snupkg') } | Sort-Object Name)
          if (2 -ne $files.Count) { throw "Expected a package and symbol package; found $($files.Count) release assets." }
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $assetDirectory 'SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath 'artifacts/release-assets' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $arguments = @('release', 'create', $env:GITHUB_REF_NAME, '--verify-tag', '--title', "Icod.Terminal ${{ needs.metadata.outputs.version }}", '--generate-notes')
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += $assets
          & gh @arguments
          if (0 -ne $LASTEXITCODE) { throw "GitHub Release creation failed with status $LASTEXITCODE." }
