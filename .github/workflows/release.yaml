name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag on exact main HEAD
        shell: pwsh
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          if (0 -ne $LASTEXITCODE) {
              throw 'Unable to refresh the current origin/main commit.'
          }

          $mainCommit = (git rev-parse origin/main).Trim()
          if (0 -ne $LASTEXITCODE -or [string]::IsNullOrWhiteSpace($mainCommit)) {
              throw 'Unable to resolve the current origin/main commit.'
          }
          if ($env:GITHUB_SHA -ne $mainCommit) {
              throw "Release tag '$env:GITHUB_REF_NAME' points to '$env:GITHUB_SHA', but the exact current main commit is '$mainCommit'."
          }

      - id: version
        name: Validate tag and package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$tag' is not a supported v<semver> tag."
          }

          $tagVersion = $Matches.version
          [xml]$project = Get-Content -LiteralPath 'Icod.Terminal.csproj' -Raw
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          $packageVersionNode = $project.SelectSingleNode('/Project/PropertyGroup/PackageVersion')
          if ($null -eq $versionNode -or $null -eq $packageVersionNode) {
              throw 'Icod.Terminal.csproj must declare both Version and PackageVersion.'
          }

          $projectVersion = $versionNode.InnerText
          $packageVersion = $packageVersionNode.InnerText
          if ($projectVersion -ne $packageVersion) {
              throw "Version '$projectVersion' does not match PackageVersion '$packageVersion'."
          }
          if ($tagVersion -ne $packageVersion) {
              throw "Tag version '$tagVersion' does not match PackageVersion '$packageVersion'."
          }

          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($tagVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  validate:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet clean Icod.Terminal.sln -c Release
      - run: dotnet restore Icod.Terminal.sln
      - run: dotnet build Icod.Terminal.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.Terminal.sln -c Release --no-build --logger trx

      - name: Pack Release package
        run: dotnet pack Icod.Terminal.csproj -c Release --no-build --output artifacts

      - name: Verify Release package on Windows
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: .github\scripts\verify-release-package.cmd artifacts Release

      - name: Verify Release package on POSIX
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash .github/scripts/verify-release-package.sh artifacts Release

      - name: Upload canonical release package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            artifacts/Icod.Terminal.${{ needs.metadata.outputs.version }}.nupkg
            artifacts/Icod.Terminal.${{ needs.metadata.outputs.version }}.snupkg
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    needs: [metadata, validate]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts/package

      - name: Exchange GitHub OIDC token for NuGet credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $package = 'artifacts/package/Icod.Terminal.${{ needs.metadata.outputs.version }}.nupkg'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
              throw "Expected package '$package' was not downloaded."
          }

          dotnet nuget push $package `
              --api-key $env:NUGET_API_KEY `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate
          if (0 -ne $LASTEXITCODE) {
              throw "NuGet.org publication failed with status $LASTEXITCODE."
          }

  publish-github-packages:
    needs: [metadata, validate, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts/package

      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          dotnet nuget add source $source `
              --name github-release `
              --username $env:GITHUB_ACTOR_NAME `
              --password $env:GITHUB_TOKEN `
              --store-password-in-clear-text
          if (0 -ne $LASTEXITCODE) {
              throw "GitHub Packages source configuration failed with status $LASTEXITCODE."
          }

          $package = 'artifacts/package/Icod.Terminal.${{ needs.metadata.outputs.version }}.nupkg'
          dotnet nuget push $package `
              --source github-release `
              --api-key $env:GITHUB_TOKEN `
              --skip-duplicate
          if (0 -ne $LASTEXITCODE) {
              throw "GitHub Packages publication failed with status $LASTEXITCODE."
          }

  github-release:
    needs: [metadata, validate, publish-nuget, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts/release-assets

      - name: Create checksums
        shell: pwsh
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(
              Get-ChildItem -LiteralPath $assetDirectory -File |
                  Where-Object { $_.Extension -in @('.nupkg', '.snupkg') } |
                  Sort-Object Name
          )
          if (2 -ne $files.Count) {
              throw "Expected two release packages before checksumming; found $($files.Count)."
          }

          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
              (Join-Path $assetDirectory 'SHA256SUMS.txt'),
              $lines,
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = '${{ needs.metadata.outputs.version }}'
          $assetDirectory = [System.IO.Path]::GetFullPath('artifacts/release-assets')
          $notes = @'
          ## Installation

          ```text
          dotnet add package Icod.Terminal --version {0}
          ```

          `Icod.Terminal` targets `net8.0`, `net9.0`, and `net10.0`. Its runtime
          package dependencies are `Icod.TermInfo 1.4.1` and `Icod.Timing 1.0.0`.

          The NuGet package, symbol package, and SHA-256 checksums are attached
          to this release.
          '@ -f $version

          $assets = @(
              Get-ChildItem -LiteralPath $assetDirectory -File |
                  Where-Object { $_.Extension -in @('.nupkg', '.snupkg', '.txt') } |
                  Sort-Object Name |
                  ForEach-Object { $_.FullName }
          )
          if (3 -ne $assets.Count) {
              throw "Expected three GitHub Release assets; found $($assets.Count)."
          }

          $arguments = @(
              'release', 'create', $tag,
              '--verify-tag',
              '--title', "Icod.Terminal $version",
              '--generate-notes',
              '--notes', $notes
          )
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += $assets

          & gh @arguments
          if (0 -ne $LASTEXITCODE) {
              throw "GitHub Release creation failed with status $LASTEXITCODE."
          }
