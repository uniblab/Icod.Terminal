name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  RELEASE_DIRECTORY: artifacts/release
  SELECTED_PACKAGE_DIRECTORY: artifacts/release-packages
  PACKAGE_ARTIFACT: nuget-packages

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require solution
        shell: pwsh
        run: |
          $solutionPath = Join-Path $PWD '${{ github.event.repository.name }}.sln'
          if (-not (Test-Path -LiteralPath $solutionPath -PathType Leaf)) {
              throw "A tagged release requires the root solution '$solutionPath'."
          }
      - name: Require tagged commit on default branch
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if (0 -ne $LASTEXITCODE) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not point to a commit contained in 'main'."
          }
      - id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw "Release tag '$tag' is not a supported v<semver> tag."
          }
          $version = $Matches.version
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Require curated release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notesPath = Join-Path $PWD "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
              throw "Tagged release '$version' requires curated release notes at '$notesPath'."
          }

  runtime:
    needs: metadata
    name: Runtime acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify runtime and source integration
        shell: pwsh
        run: ./packaging/VerifyRuntime.ps1 -Configuration '${{ env.CONFIGURATION }}'

  package-prep:
    needs: metadata
    name: Package candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build package candidate and freeze public API
        shell: pwsh
        run: >-
          ./packaging/BuildPackageArtifact.ps1
          -ArtifactDirectory '${{ env.RELEASE_DIRECTORY }}'
          -Configuration '${{ env.CONFIGURATION }}'
          -ExpectedVersion '${{ needs.metadata.outputs.version }}'
          -ApiOutputDirectory artifacts/release-public-api
      - id: select
        shell: pwsh
        run: >-
          ./packaging/SelectReleasePackages.ps1
          -SourceDirectory '${{ env.RELEASE_DIRECTORY }}'
          -DestinationDirectory '${{ env.SELECTED_PACKAGE_DIRECTORY }}'
          -ExpectedVersion '${{ needs.metadata.outputs.version }}'
          -GitHubOutputPath $env:GITHUB_OUTPUT
      - name: Require Icod.Terminal release package
        shell: pwsh
        run: |
          if ('true' -ne '${{ steps.select.outputs.has_packages }}' -or '1' -ne '${{ steps.select.outputs.package_count }}') {
              throw 'The Icod.Terminal release must select exactly one package matching the release tag.'
          }
      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: |
            ${{ env.SELECTED_PACKAGE_DIRECTORY }}/*.nupkg
            ${{ env.SELECTED_PACKAGE_DIRECTORY }}/*.snupkg
          if-no-files-found: error
          retention-days: 7

  package-contracts:
    needs: [metadata, package-prep]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: foundation
            name: Foundation
          - shard: presentation
            name: Presentation
          - shard: semantic
            name: Semantic and hardening
          - shard: release
            name: 1.0 release line
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - name: Verify package contract shard
        shell: pwsh
        run: >-
          ./packaging/VerifyPackageContractShard.ps1
          -ArtifactDirectory artifacts/package
          -Shard '${{ matrix.shard }}'
          -Configuration '${{ env.CONFIGURATION }}'
          -ExpectedVersion '${{ needs.metadata.outputs.version }}'

  publish-nuget:
    needs: [metadata, runtime, package-prep, package-contracts]
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'artifacts/package' -Filter '*.nupkg' -File)
          if (1 -ne $packages.Count) { throw "Expected one NuGet package; found $($packages.Count)." }
          $package = $packages[0]
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw "NuGet.org publication failed for '$($package.Name)' with status $LASTEXITCODE." }

  publish-github-packages:
    needs: [metadata, runtime, package-prep, package-contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/package
      - shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          $packages = @(Get-ChildItem -LiteralPath 'artifacts/package' -Filter '*.nupkg' -File)
          if (1 -ne $packages.Count) { throw "Expected one GitHub package; found $($packages.Count)." }
          $package = $packages[0]
          dotnet nuget push $package.FullName --source $source --api-key $env:GITHUB_TOKEN --skip-duplicate
          if (0 -ne $LASTEXITCODE) { throw "GitHub Packages publication failed for '$($package.Name)' with status $LASTEXITCODE." }

  github-release:
    needs: [metadata, publish-nuget, publish-github-packages]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.publish-nuget.result == 'success' &&
      needs.publish-github-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/release-assets
      - name: Create checksums
        shell: pwsh
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File | Where-Object { $_.Extension -in @('.nupkg', '.snupkg') } | Sort-Object Name)
          if (2 -ne $files.Count) { throw "Expected a package and symbol package; found $($files.Count) release assets." }
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $assetDirectory 'SHA256SUMS.txt'), $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ needs.metadata.outputs.version }}'
          $notesPath = Join-Path $PWD "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
              throw "Curated release notes are missing for $version at '$notesPath'."
          }

          $assets = @(Get-ChildItem -LiteralPath 'artifacts/release-assets' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $arguments = @(
              'release',
              'create',
              $env:GITHUB_REF_NAME,
              '--verify-tag',
              '--title',
              "Icod.Terminal $version",
              '--notes-file',
              $notesPath
          )
          if ('true' -eq '${{ needs.metadata.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += $assets
          & gh @arguments
          if (0 -ne $LASTEXITCODE) { throw "GitHub Release creation failed with status $LASTEXITCODE." }
