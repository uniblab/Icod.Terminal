name: license-header-closure

on:
  push:
    branches:
      - 1.0.0-stable-squash

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[license-headers-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Apply project-appropriate license headers
        shell: pwsh
        run: ./packaging/ApplyLicenseHeaders.ps1
      - name: Commit generated license closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.csproj' src tests samples tools
          if git diff --cached --quiet; then
            echo "No license header changes were required."
            exit 0
          fi
          git commit -m "1.0.0: apply GPL/LGPL source headers [license-headers-applied]"
          git push origin HEAD:1.0.0-stable-squash
