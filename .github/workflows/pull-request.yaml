name: pull-request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Staging

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      has_solution: ${{ steps.repository.outputs.has_solution }}
      solution_path: ${{ steps.repository.outputs.solution_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - id: repository
        shell: pwsh
        run: ./packaging/Get-RepositoryMetadata.ps1 -Configuration '${{ env.CONFIGURATION }}' -GitHubOutputPath $env:GITHUB_OUTPUT

  validate:
    needs: metadata
    if: needs.metadata.outputs.has_solution == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            verify_packages: false
          - os: ubuntu-latest
            name: Linux
            verify_packages: true
          - os: macos-latest
            name: macOS
            verify_packages: false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Discover repository metadata on runner
        id: repository
        shell: pwsh
        run: ./packaging/Get-RepositoryMetadata.ps1 -Configuration '${{ env.CONFIGURATION }}' -GitHubOutputPath $env:GITHUB_OUTPUT
      - run: dotnet restore '${{ steps.repository.outputs.solution_path }}'
      - run: dotnet build '${{ steps.repository.outputs.solution_path }}' -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test '${{ steps.repository.outputs.solution_path }}' -c ${{ env.CONFIGURATION }} --no-build --no-restore --logger trx
      - name: Verify DCurses synchronized-output acceptance
        shell: pwsh
        run: ./packaging/VerifyDCursesSynchronizedOutput.ps1 -Configuration '${{ env.CONFIGURATION }}'
      - name: Pack Staging artifacts
        if: matrix.verify_packages
        run: dotnet pack '${{ steps.repository.outputs.solution_path }}' -c ${{ env.CONFIGURATION }} --no-build --no-restore -o artifacts -p:ContinuousIntegrationBuild=true
      - name: Verify exact Staging package artifacts
        if: matrix.verify_packages
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts -Configuration '${{ env.CONFIGURATION }}'
      - name: Verify 0.8 cursor-style package contract
        if: matrix.verify_packages
        shell: pwsh
        run: ./packaging/VerifyCursorStylePackage.ps1 -ArtifactDirectory artifacts -Configuration '${{ env.CONFIGURATION }}'
      - name: Verify 0.9 synchronized-output package contract
        if: matrix.verify_packages
        shell: pwsh
        run: ./packaging/VerifySynchronizedOutputPackage.ps1 -ArtifactDirectory artifacts -Configuration '${{ env.CONFIGURATION }}'
      - name: Upload validated Staging package artifacts
        if: matrix.verify_packages
        uses: actions/upload-artifact@v4
        with:
          name: icod-terminal-pr-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7
