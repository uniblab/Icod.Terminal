name: pull-request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Staging
  PACKAGE_CANDIDATE_ARTIFACT: icod-terminal-pr-package-candidate
  PACKAGE_ARTIFACT: icod-terminal-pr-packages

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
    name: Runtime ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Verify runtime and source integration
        shell: pwsh
        run: ./packaging/VerifyRuntime.ps1 -Configuration '${{ env.CONFIGURATION }}'

  package-prep:
    name: Package candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build package candidate and freeze public API
        shell: pwsh
        run: >-
          ./packaging/BuildPackageArtifact.ps1
          -ArtifactDirectory artifacts/package
          -Configuration '${{ env.CONFIGURATION }}'
          -ApiOutputDirectory artifacts/public-api
      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_CANDIDATE_ARTIFACT }}
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
            artifacts/public-api/*.txt
          if-no-files-found: error
          retention-days: 7

  package-contracts:
    needs: package-prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: foundation
            name: Foundation
          - shard: presentation
            name: Presentation
          - shard: semantic
            name: Semantic and hardening
          - shard: rc
            name: 1.0 RC
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_CANDIDATE_ARTIFACT }}
          path: artifacts/candidate
      - name: Verify package contract shard
        shell: pwsh
        run: >-
          ./packaging/VerifyPackageContractShard.ps1
          -ArtifactDirectory artifacts/candidate/package
          -Shard '${{ matrix.shard }}'
          -Configuration '${{ env.CONFIGURATION }}'

  validated-package:
    needs: [package-prep, package-contracts]
    name: Validated package artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_CANDIDATE_ARTIFACT }}
          path: artifacts/validated
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: |
            artifacts/validated/package/*.nupkg
            artifacts/validated/package/*.snupkg
            artifacts/validated/public-api/*.txt
          if-no-files-found: error
          retention-days: 7
